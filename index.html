<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RunCoach">
<title>RUN/RIDE/COACH</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#000;--bg2:#0a0a0a;--bg3:#111;--b:#1e1e1e;--b2:#2a2a2a;
  --t:#f0f0f0;--m:#555;--m2:#888;
  --lime:#a3e635;--cyan:#22d3ee;--rose:#fb7185;--amber:#fbbf24;
  --orange:#fb923c;--red:#ef4444;--green:#4ade80;--purple:#a78bfa;
  --safe:env(safe-area-inset-bottom,20px);--top:env(safe-area-inset-top,44px);
  --nav:56px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:'JetBrains Mono',monospace;font-size:13px;overflow:hidden}
.df{font-family:'Bebas Neue',sans-serif;letter-spacing:.05em}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
/* HEADER */
#hdr{padding:max(calc(var(--top) + 10px),54px) 14px 0;border-bottom:1px solid var(--b);flex-shrink:0;background:var(--bg)}
.htop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo{font-size:1.5rem;line-height:1}.logo .sl{color:var(--lime)}.logo .sc{color:var(--cyan)}
.sub{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--m);margin-top:1px}
.hbtns{display:flex;gap:6px}
.hbtn{border:none;cursor:pointer;font-family:inherit;font-size:10px;text-transform:uppercase;letter-spacing:.1em;border-radius:2px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;padding:0 12px;transition:all .15s}
.hbtn-add{background:var(--lime);color:#000;font-weight:700}
.hbtn-add:active{background:#84cc16}
.hbtn-set{background:transparent;color:var(--m2);border:1px solid var(--b)}
.hbtn-set:active{border-color:var(--lime);color:var(--lime)}
/* CONTENT */
#content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:12px 14px calc(var(--nav) + var(--safe) + 12px)}
/* BOTTOM NAV */
#nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav) + var(--safe));padding-bottom:var(--safe);background:var(--bg2);border-top:1px solid var(--b);display:flex;z-index:50}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:transparent;border:none;cursor:pointer;font-family:inherit;font-size:7px;text-transform:uppercase;letter-spacing:.08em;color:var(--m);padding:6px 2px 4px;transition:color .15s}
.nb.active{color:var(--lime)}.nb .ni{font-size:16px;line-height:1}
/* CARDS */
.card{background:var(--bg3);border:1px solid var(--b);padding:13px;margin-bottom:9px;border-radius:2px}
.ci{padding:9px 0 9px 12px;border-bottom:1px solid var(--b)}
.ci:last-child{border-bottom:none}
.ci-cat{font-size:8px;letter-spacing:.14em;font-weight:700;margin-bottom:3px}
.ci-msg{font-size:11.5px;line-height:1.5;color:var(--m)}
.cl{font-size:9px;text-transform:uppercase;letter-spacing:.18em;color:var(--m);margin-bottom:7px}
.cv{font-size:2rem;font-weight:300;font-variant-numeric:tabular-nums}
.ch{font-size:9px;color:var(--m);margin-top:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}
@media(min-width:560px){.g4{grid-template-columns:repeat(4,1fr)}}
/* RECOMMENDATION */
.rec{background:var(--bg2);border:1px solid var(--b);padding:13px;margin-bottom:9px;display:flex;gap:9px;border-radius:2px}
.rs{width:3px;border-radius:2px;flex-shrink:0}
.rl{font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:var(--m);margin-bottom:4px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}
.rt{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;line-height:1.3;margin-bottom:5px}
.rr{font-size:10px;color:#aaa;margin-top:3px}.rr::before{content:'• ';color:var(--amber)}
/* CHART */
.cw{position:relative;height:165px;margin-top:7px}
.cwt{position:relative;height:240px;margin-top:7px}
/* WORKOUT ROW */
.wrow{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--b);font-size:11px}
.wrow:last-child{border-bottom:none}
.sd{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.wd{color:var(--m2);width:48px;flex-shrink:0}.wk{font-weight:500;width:42px;font-variant-numeric:tabular-nums}
.wp{color:var(--m2);width:65px;font-variant-numeric:tabular-nums;flex-shrink:0}
.wh{color:var(--m2);flex:1;font-variant-numeric:tabular-nums}
.zp{font-size:8px;padding:2px 5px;border-radius:2px;flex-shrink:0}
.tv{font-size:9px;color:var(--m);flex-shrink:0}
.db{background:none;border:none;color:var(--m);cursor:pointer;padding:3px;flex-shrink:0;font-size:12px;min-width:28px;min-height:28px;display:flex;align-items:center;justify-content:center}
.db:active{color:var(--red)}
.eb{background:none;border:none;color:var(--m);cursor:pointer;padding:3px;flex-shrink:0;font-size:12px;min-width:28px;min-height:28px;display:flex;align-items:center;justify-content:center}
.eb:active{color:var(--cyan)}
/* ZONE LEGEND */
.zl{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:7px}
.zi{font-size:8px;text-align:center;color:var(--m)}
/* FILTERS */
.frow{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.fp{font-size:9px;padding:5px 9px;border:1px solid var(--b);background:transparent;color:var(--m2);cursor:pointer;font-family:inherit;text-transform:uppercase;letter-spacing:.08em;border-radius:2px;min-height:34px;transition:all .15s}
.fp.on{background:var(--bg3);color:var(--t);border-color:var(--b2)}
/* PLAN */
.plan-week{border:1px solid var(--b);margin-bottom:7px;border-radius:2px;overflow:hidden}
.pw-h{padding:10px 13px;display:flex;align-items:center;gap:8px;cursor:pointer;background:var(--bg3)}
.pw-num{font-family:'Bebas Neue',sans-serif;font-size:1rem}
.pw-phase{font-size:8px;text-transform:uppercase;letter-spacing:.12em;padding:2px 6px;border-radius:2px}
.pw-dates{font-size:9px;color:var(--m);margin-left:auto}.pw-prog{font-size:9px;color:var(--m);margin-left:5px}
.pw-b{display:none;border-top:1px solid var(--b)}.pw-b.open{display:block}
.sr{padding:10px 13px;border-bottom:1px solid var(--b);display:flex;align-items:flex-start;gap:9px}
.sr:last-of-type{border-bottom:none}
.sr-day{font-size:10px;color:var(--m);width:26px;flex-shrink:0;padding-top:1px}
.sr-ico{font-size:1.2rem;flex-shrink:0;width:24px;text-align:center}
.sr-body{flex:1;min-width:0}
.sr-title{font-size:11px;font-weight:600;margin-bottom:2px}
.sr-desc{font-size:10px;color:var(--m2);line-height:1.5}
.sr-note{font-size:9px;color:var(--m);margin-top:3px;font-style:italic}
.sr-tags{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.sr-tag{font-size:8px;padding:2px 5px;border-radius:2px;border:1px solid var(--b2);color:var(--m2)}
.sr-chk{flex-shrink:0;width:28px;height:28px;border-radius:50%;border:1px solid var(--b2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .15s;margin-top:1px}
.sr-chk.done{background:var(--lime);border-color:var(--lime);color:#000}
.today-mark{background:rgba(163,230,53,.05);border-left:2px solid var(--lime)!important}
.pw-sum{padding:7px 13px;background:rgba(163,230,53,.03);font-size:9px;color:var(--m2);border-top:1px solid var(--b)}
.plan-prog{background:var(--bg3);border:1px solid var(--b);padding:12px 13px;margin-bottom:9px;border-radius:2px}
.pp-bar{height:3px;background:var(--b);border-radius:2px;overflow:hidden;margin:5px 0}
.pp-fill{height:100%;background:var(--lime);border-radius:2px;transition:width .5s}
.pp-stats{font-size:10px;color:var(--m2);display:flex;gap:12px;flex-wrap:wrap}
.pp-stats span{color:var(--t)}
.cwb{background:rgba(163,230,53,.07);border:1px solid rgba(163,230,53,.2);padding:11px 13px;margin-bottom:9px;border-radius:2px}
.cwb-l{font-size:8px;text-transform:uppercase;letter-spacing:.2em;color:var(--lime);margin-bottom:3px}
.cwb-t{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;margin-bottom:2px}
.cwb-d{font-size:10px;color:var(--m2);line-height:1.5}
/* PMC */
.pmi{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:9px}
.pmit{background:var(--bg3);border:1px solid var(--b);padding:10px;border-radius:2px}
.pmitl{font-size:9px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.pmitb{font-size:10px;color:var(--m2);line-height:1.5}
.pml{display:flex;gap:10px;flex-wrap:wrap;margin-top:7px}
.pmli{display:flex;align-items:center;gap:4px;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--m2)}
.pmd{width:10px;height:3px;border-radius:2px}
/* PR */
.prg{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}
@media(min-width:560px){.prg{grid-template-columns:repeat(4,1fr)}}
.prc{border:1px solid var(--b);padding:11px;border-radius:2px}
.prl{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--m);margin-bottom:4px}
.prt{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:var(--lime)}
.prp{font-size:9px;color:var(--m)}.prd{font-size:9px;color:var(--m);margin-top:1px}
/* MODAL BASE */
.ovr{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;display:flex;align-items:flex-end}
.mod{background:#0d0d0d;border-top:1px solid var(--b);width:100%;max-height:90dvh;overflow-y:auto;padding:18px 16px calc(18px + var(--safe));border-radius:12px 12px 0 0}
.mt{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;margin-bottom:2px}
.ms{font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:var(--m);margin-bottom:15px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--m);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;background:#000;border:1px solid var(--b2);color:var(--t);padding:11px;font-family:inherit;font-size:13px;border-radius:2px;-webkit-appearance:none;min-height:44px}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--lime)}
.fld .hint{font-size:9px;color:var(--m);margin-top:3px}
.fld textarea{resize:none;height:54px;min-height:54px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stog{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:15px}
.sb{padding:11px 8px;border:1px solid var(--b2);background:transparent;color:var(--m2);cursor:pointer;font-family:inherit;font-size:10px;text-transform:uppercase;letter-spacing:.08em;border-radius:2px;display:flex;align-items:center;justify-content:center;gap:4px;min-height:44px;transition:all .15s}
.sb.ar{background:var(--lime);color:#000;border-color:var(--lime);font-weight:700}
.sb.ab{background:var(--cyan);color:#000;border-color:var(--cyan);font-weight:700}
.sb.ap{background:var(--purple);color:#fff;border-color:var(--purple);font-weight:700}
.rw{display:flex;flex-direction:column;gap:3px}
.rw input[type=range]{width:100%;accent-color:var(--lime);height:44px}
.rl2{display:flex;justify-content:space-between;font-size:9px;color:var(--m)}
.tp{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--b);padding-top:11px;margin-top:3px}
.tpl{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--m)}
.tpv{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--lime)}
.at{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--m2);background:none;border:none;cursor:pointer;font-family:inherit;padding:7px 0;display:block}
.as{border-top:1px solid var(--b);padding-top:11px;margin-top:3px}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}
.bc{background:transparent;color:var(--m2);border:1px solid var(--b2);padding:13px;border-radius:2px;font-family:inherit;font-size:11px;text-transform:uppercase;letter-spacing:.1em;cursor:pointer;min-height:44px}
.bs{background:var(--lime);color:#000;padding:13px;font-weight:700;border-radius:2px;border:none;font-family:inherit;font-size:11px;text-transform:uppercase;letter-spacing:.1em;cursor:pointer;min-height:44px}
.xbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.xbtn{font-size:9px;padding:8px 11px;border:1px solid var(--b2);background:transparent;color:var(--m2);cursor:pointer;font-family:inherit;text-transform:uppercase;letter-spacing:.08em;border-radius:2px;min-height:38px}
/* TOAST */
.toast{position:fixed;bottom:calc(var(--nav) + var(--safe) + 12px);left:50%;transform:translateX(-50%);background:var(--lime);color:#000;font-size:11px;font-weight:700;padding:8px 16px;border-radius:20px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
/* ── MOBILITY MODULE ─────────────────────────────────────── */
.mob-hdr{background:var(--bg3);border:1px solid var(--b);padding:10px 13px;border-radius:2px;margin-bottom:9px}
.mob-tabs{display:flex;gap:0;border-bottom:1px solid var(--b);margin:0 -14px 12px;padding:0 14px;overflow-x:auto;scrollbar-width:none}
.mob-tabs::-webkit-scrollbar{display:none}
.mtab{flex-shrink:0;padding:9px 12px 7px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;background:transparent;color:var(--m);border:none;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;transition:all .15s}
.mtab.active{color:var(--purple);border-bottom-color:var(--purple)}
.wnav{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--b);padding:10px 13px;border-radius:2px;margin-bottom:9px}
.wn-inf{flex:1}.wn-l{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--m)}
.wn-row{display:flex;align-items:center;gap:8px;margin-top:2px}
.wn-v{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:var(--purple)}
.wn-p{font-size:8px;padding:2px 7px;border-radius:2px}
.wbtn{background:transparent;border:1px solid var(--b2);color:var(--m2);padding:6px 10px;cursor:pointer;font-family:inherit;font-size:12px;border-radius:2px}
.wbtn:active{border-color:var(--purple);color:var(--purple)}
.pbanner{border-left:3px solid var(--purple);padding:9px 13px;background:rgba(167,139,250,.04);margin-bottom:9px;border-radius:0 2px 2px 0}
.pb-l{font-size:8px;text-transform:uppercase;letter-spacing:.2em;color:var(--purple);margin-bottom:2px}
.pb-t{font-size:11px;color:var(--m2);line-height:1.6}
.sess-hdr{background:rgba(167,139,250,.07);border:1px solid rgba(167,139,250,.2);padding:12px 13px;margin-bottom:9px;border-radius:2px}
.sh-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.sh-title{font-family:'Bebas Neue',sans-serif;font-size:1.2rem}
.sh-meta{font-size:9px;color:var(--m2)}
.sh-bar{height:3px;background:var(--b);border-radius:2px;overflow:hidden;margin-bottom:5px}
.sh-fill{height:100%;background:var(--purple);border-radius:2px;transition:width .3s}
.sh-stats{font-size:9px;color:var(--m2)}
.sess-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--b);cursor:pointer}
.sess-item:last-child{border-bottom:none}
.si-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.si-body{flex:1;min-width:0}
.si-name{font-size:11px;font-weight:600}
.si-note{font-size:9px;color:var(--m2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si-dur{font-size:9px;color:var(--m2);flex-shrink:0}
.si-ck{width:22px;height:22px;border-radius:50%;border:1px solid var(--b2);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .15s}
.si-ck.done{background:var(--purple);border-color:var(--purple);color:#fff}
.mfrow{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.mfp{font-size:9px;padding:4px 8px;border:1px solid var(--b);background:transparent;color:var(--m2);cursor:pointer;font-family:inherit;text-transform:uppercase;letter-spacing:.08em;border-radius:2px;transition:all .15s;white-space:nowrap}
.mfp.on{background:var(--bg3);color:var(--t);border-color:var(--b2)}
.excard{border:1px solid var(--b);margin-bottom:8px;border-radius:2px;overflow:hidden}
.ex-h{padding:11px 13px;display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--bg3)}
.ex-ico{font-size:1.2rem;flex-shrink:0;width:28px;text-align:center}
.ex-inf{flex:1;min-width:0}
.ex-nm{font-size:11px;font-weight:700;margin-bottom:2px}
.ex-mt{font-size:9px;color:var(--m2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cpill{font-size:8px;padding:1px 5px;border-radius:2px;flex-shrink:0}
.ex-ck{width:22px;height:22px;border-radius:50%;border:1px solid var(--b2);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .15s}
.ex-ck.done{background:var(--purple);border-color:var(--purple);color:#fff}
.ex-body{display:none;border-top:1px solid var(--b);padding:13px}
.ex-body.open{display:block}
.msec{margin-bottom:12px}
.msec-t{font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:var(--m);margin-bottom:6px;padding-left:8px;border-left:2px solid var(--purple)}
ol.steps{list-style:none;counter-reset:s;padding:0}
ol.steps li{counter-increment:s;font-size:11px;color:var(--m2);line-height:1.7;padding:2px 0 2px 22px;position:relative}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:4px;width:15px;height:15px;border-radius:50%;background:var(--b2);color:var(--purple);font-size:8px;display:flex;align-items:center;justify-content:center;font-weight:700}
ul.errs{list-style:none;padding:0}
ul.errs li{font-size:11px;color:var(--m2);line-height:1.7;padding:2px 0 2px 16px;position:relative}
ul.errs li::before{content:'✗';position:absolute;left:0;color:var(--red);font-size:10px;top:3px}
.ebm{background:rgba(167,139,250,.05);border:1px solid rgba(167,139,250,.15);padding:10px 11px;border-radius:2px;margin-top:8px}
.ebm-l{font-size:8px;text-transform:uppercase;letter-spacing:.15em;color:var(--purple);margin-bottom:3px}
.ebm-t{font-size:10px;color:var(--m2);line-height:1.6}
.prog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}
.prog-c{border:1px solid var(--b2);padding:7px;border-radius:2px;text-align:center}
.prog-c.cur{border-color:var(--purple);background:rgba(167,139,250,.06)}
.prog-lbl{font-size:8px;text-transform:uppercase;letter-spacing:.08em;color:var(--m);margin-bottom:3px}
.prog-v{font-size:10px;color:var(--m2)}.prog-c.cur .prog-v{color:var(--purple)}
.run-btn{width:100%;background:var(--purple);color:#fff;border:none;padding:11px;font-family:inherit;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;cursor:pointer;border-radius:2px;margin-top:10px}
.mstat{background:var(--bg3);border:1px solid var(--b);padding:12px;border-radius:2px}
.mstat-l{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--m);margin-bottom:4px}
.mstat-v{font-size:1.8rem;font-weight:300;font-variant-numeric:tabular-nums}
.bars7{display:flex;gap:5px;align-items:flex-end;height:56px;margin-top:6px}
.bar7-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.bar7{width:100%;border-radius:2px;min-height:4px}
.bar7-lbl{font-size:8px;color:var(--m)}
.catbar{margin-bottom:8px}
.catbar-hdr{display:flex;justify-content:space-between;font-size:10px;margin-bottom:3px}
.catbar-bg{height:3px;background:var(--b);border-radius:2px}
.catbar-fill{height:100%;border-radius:2px}
/* TIMER MODAL */
.t-display{text-align:center;padding:14px 0}
.t-val{font-family:'Bebas Neue',sans-serif;font-size:5rem;color:var(--purple);line-height:1}
.t-side{font-size:12px;text-transform:uppercase;letter-spacing:.15em;color:var(--amber);margin-top:4px}
.t-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:var(--m);margin-top:2px}
.t-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.tbtn{padding:10px 18px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;cursor:pointer;font-family:inherit;border-radius:2px;border:1px solid var(--b2);background:transparent;color:var(--m2)}
.tbtn.primary{background:var(--purple);color:#fff;border-color:var(--purple);font-weight:700}
.tbtn:active{opacity:.7}
.set-row{display:flex;gap:6px;justify-content:center;margin-top:10px}
.sdot{width:10px;height:10px;border-radius:50%;border:1px solid var(--b2)}
.sdot.done{background:var(--purple);border-color:var(--purple)}
.sdot.cur{border-color:var(--purple)}
.rep-ctrl{display:flex;align-items:center;justify-content:center;gap:16px;margin:14px 0}
.rbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--b2);background:transparent;cursor:pointer;font-size:20px;color:var(--t);display:flex;align-items:center;justify-content:center}
.rval{font-family:'Bebas Neue',sans-serif;font-size:2.5rem;color:var(--purple);min-width:50px;text-align:center}
.rlbl{font-size:8px;text-transform:uppercase;letter-spacing:.12em;color:var(--m);text-align:center}
.mod-steps{list-style:none;padding:0;margin:10px 0;font-size:11px;color:var(--m2);line-height:1.8}
.mod-steps li{padding:2px 0 2px 16px;position:relative}
.mod-steps li::before{content:'→';position:absolute;left:0;color:var(--purple)}
.done-bar{display:flex;gap:8px;margin-top:14px}
.done-bar .tbtn{flex:1}

</head>

    <button class="nb" id="nb5" onclick="setTab('mobility')"><div class="ni">💆</div>Mobilność</button>

</div>
<div class="toast" id="toast"></div>

<!-- ADD / EDIT MODAL -->
<div class="ovr" id="addModal" style="display:none">

    </div>

  </div>
  <div class="mbtns">

  </div>

</div>

  <div class="mbtns">

  </div>
</div>
</div>

// INDEXEDDB — unified 'runcoach-v1'
// ═══════════════════════════════════════════════════════════════
function initDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('runcoach-v1', 2);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
    };
    r.onsuccess = e => { db = e.target.result; res(); };
    r.onerror = e => rej(e.target.error);
  });
}
function dbGet(k) {
  return new Promise((res, rej) => {
    const r = db.transaction('kv','readonly').objectStore('kv').get(k);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function dbSet(k, v) {
  return new Promise((res, rej) => {
    const r = db.transaction('kv','readwrite').objectStore('kv').put(v, k);
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}

// HELPERS — GENERAL
// ═══════════════════════════════════════════════════════════════
const todayStr = () => new Date().toISOString().split('T')[0];
const fmtPace = s => { const m=Math.floor(s/60); return `${m}:${String(Math.round(s%60)).padStart(2,'0')}`; };
const fmtDur = m => { const h=Math.floor(m/60); return h ? `${h}h ${Math.round(m%60)}min` : `${Math.round(m)}min`; };
const sportIcon = s => ({run:'🏃',bike:'🚴',pull:'💪',race:'🏆'}[s]||'🏃');
const typeLabel = t => ({easy:'ŁATWY',tempo:'TEMPO',interval:'INTERWAŁY',long:'DŁUGI',race:'WYŚCIG'}[t]||t.toUpperCase());
const typeColor = t => ({easy:'var(--cyan)',tempo:'var(--amber)',interval:'var(--rose)',long:'var(--green)',race:'var(--orange)'}[t]||'var(--m2)');

function calcTSS(w) {
  if (w.sport === 'pull') {
    return Math.round((w.reps || 5) * (w.sets || 3) * 2.5);
  }
  if (!w.avgHR || !w.dur) {
    const base = w.sport === 'run' ? (w.dist||0)*8 : (w.dist||0)*4;
    return Math.round(base * (w.rpe||5)/5);
  }
  const hrc = ((w.avgHR - settings.rhr) / (settings.lthr - settings.rhr));
  const if_ = Math.min(hrc, 1.15);
  return Math.round((w.dur / 60) * if_ * if_ * 100);
}

function karvonen() {
  const hrr = settings.maxHR - settings.rhr;
  return [
    {z:'Z1',min:Math.round(settings.rhr+hrr*0.50),max:Math.round(settings.rhr+hrr*0.60),c:'var(--cyan)',label:'Regeneracja'},
    {z:'Z2',min:Math.round(settings.rhr+hrr*0.60),max:Math.round(settings.rhr+hrr*0.70),c:'var(--green)',label:'Aerobowy'},
    {z:'Z3',min:Math.round(settings.rhr+hrr*0.70),max:Math.round(settings.rhr+hrr*0.80),c:'var(--amber)',label:'Próg'},
    {z:'Z4',min:Math.round(settings.rhr+hrr*0.80),max:Math.round(settings.rhr+hrr*0.90),c:'var(--orange)',label:'Wysiłkowy'},
    {z:'Z5',min:Math.round(settings.rhr+hrr*0.90),max:settings.maxHR,c:'var(--red)',label:'Maksymalny'},
  ];
}

function hrZone(hr) {
  if (!hr) return null;
  const z = karvonen();
  for (let i = z.length-1; i >= 0; i--) if (hr >= z[i].min) return z[i];
  return z[0];
}

function calcPMC() {
  const sorted = [...workouts].sort((a,b)=>a.date.localeCompare(b.date));
  const days = {};
  sorted.forEach(w => { days[w.date] = (days[w.date]||0) + calcTSS(w); });
  const allDates = [];
  if (!sorted.length) return [];
  let cur = new Date(sorted[0].date);
  const end = new Date(todayStr()); end.setDate(end.getDate()+30);
  while (cur <= end) {
    allDates.push(cur.toISOString().split('T')[0]);
    cur.setDate(cur.getDate()+1);
  }
  let ctl=0, atl=0;
  return allDates.map(d => {
    const tss = days[d]||0;
    ctl = ctl + (tss-ctl)/42;
    atl = atl + (tss-atl)/7;
    return { date:d, tss, ctl:+ctl.toFixed(1), atl:+atl.toFixed(1), tsb:+(ctl-atl).toFixed(1) };
  });
}

function showToast(msg, dur=2200) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

    sub.textContent = todayPMC ? `CTL ${todayPMC.ctl.toFixed(0)} · ATL ${todayPMC.atl.toFixed(0)} · TSB ${todayPMC.tsb.toFixed(0)}` : 'RUN/RIDE/COACH';

  else if (currentTab==='mobility') c.innerHTML = renderMobility();
  if (currentTab==='load') { buildPMCChart(); buildWeeklyChart(); }
}

function analyzeCoach() {
  const ins = [];
  const pmc = calcPMC();
  const today = todayStr();
  const sorted = [...workouts].sort((a,b)=>a.date.localeCompare(b.date));
  const todayP = pmc.find(p=>p.date===today)||{ctl:0,atl:0,tsb:0};
  const d7  = new Date(Date.now()-7*864e5).toISOString().split('T')[0];
  const d14 = new Date(Date.now()-14*864e5).toISOString().split('T')[0];
  const d28 = new Date(Date.now()-28*864e5).toISOString().split('T')[0];
  const last7  = sorted.filter(w=>w.date>=d7);
  const last14 = sorted.filter(w=>w.date>=d14);

  // 1. TSB trend (7 dni)
  const p7 = pmc.find(p=>p.date===d7);
  if (p7 && todayP.ctl>0) {
    const diff = todayP.tsb - p7.tsb;
    if (diff > 10)  ins.push({t:'good',  icon:'📈', cat:'ŚWIEŻOŚĆ',    msg:`TSB wzrosło o ${diff.toFixed(0)} pkt w tygodniu — dobrze się regenerujesz. Czas na jakościowy trening.`});
    if (diff < -15) ins.push({t:'warn',  icon:'⚠️', cat:'ZMĘCZENIE',   msg:`TSB spadło o ${Math.abs(diff).toFixed(0)} pkt w 7 dni — duże nagromadzenie zmęczenia. Rozważ dzień wolny.`});
  }

  // 2. CTL ramp rate (28 dni, max 5 pkt/tydzień)
  const p28 = pmc.find(p=>p.date===d28);
  if (p28 && todayP.ctl>0) {
    const ramp = (todayP.ctl - p28.ctl) / 4;
    if (ramp > 6)      ins.push({t:'warn',  icon:'⚠️', cat:'PROGRESJA',  msg:`CTL rośnie za szybko: +${ramp.toFixed(1)} pkt/tydzień (bezpieczne max to 5). Ryzyko kontuzji z przeciążenia.`});
    else if (ramp > 0) ins.push({t:'good',  icon:'💪', cat:'FORMA',      msg:`CTL rośnie stabilnie: +${ramp.toFixed(1)} pkt/tydzień. Progresja przebiega prawidłowo.`});
    else if (ramp <-3) ins.push({t:'info',  icon:'📉', cat:'FORMA',      msg:`CTL spada ${ramp.toFixed(1)} pkt/tydzień — detrening. Zwiększ objętość lub wróć do planu.`});
  }

  // 3. ATL spike (>20 pkt w tygodniu)
  if (p7 && todayP.ctl>0) {
    const spike = todayP.atl - p7.atl;
    if (spike > 20) ins.push({t:'danger', icon:'🔴', cat:'PRZECIĄŻENIE', msg:`ATL skoczyło o ${spike.toFixed(0)} pkt w 7 dni — zbyt duży bodziec naraz. Weź 1–2 dni odpoczynku.`});
  }

  // 4. Konsekutywne dni bez przerwy
  const dates7 = [...new Set(last7.map(w=>w.date))].sort();
  let cons=1, maxCons=1;
  for (let i=1;i<dates7.length;i++) {
    const d=(new Date(dates7[i])-new Date(dates7[i-1]))/864e5;
    cons = d===1 ? cons+1 : 1;
    maxCons = Math.max(maxCons,cons);
  }
  if (maxCons>=5) ins.push({t:'warn', icon:'😴', cat:'REGENERACJA', msg:`${maxCons} dni treningowych z rzędu bez przerwy — zaplanuj dzień wolny. Superkompensacja zachodzi w odpoczynku.`});

  // 5. HR drift na łatwych biegach
  const easy = sorted.filter(w=>w.sport==='run'&&w.type==='easy'&&w.avgHR>0&&w.dist>0);
  if (easy.length>=6) {
    const r3=easy.slice(-3), o3=easy.slice(-6,-3);
    const rHR=r3.reduce((s,w)=>s+w.avgHR,0)/3;
    const oHR=o3.reduce((s,w)=>s+w.avgHR,0)/3;
    const drift=rHR-oHR;
    if (drift>6)  ins.push({t:'warn', icon:'❤️', cat:'HR DRIFT', msg:`Tętno na łatwych biegach wzrosło o ${drift.toFixed(0)} bpm (${oHR.toFixed(0)}→${rHR.toFixed(0)}) — sygnał zmęczenia lub niedoboru snu/nawodnienia.`});
    if (drift<-4) ins.push({t:'good', icon:'💚', cat:'HR DRIFT', msg:`Tętno na łatwych biegach spada (${oHR.toFixed(0)}→${rHR.toFixed(0)} bpm) — adaptacja tlenowa postępuje. Dobra robota!`});
  }

  // 6. Zasada 10% km biegowych tydzień/tydzień
  const monOffset = (new Date().getDay()||7)-1;
  const monThis = new Date(); monThis.setDate(monThis.getDate()-monOffset);
  const monLast = new Date(monThis); monLast.setDate(monLast.getDate()-7);
  const wThis = monThis.toISOString().split('T')[0];
  const wLast = monLast.toISOString().split('T')[0];
  const kmThis = workouts.filter(w=>w.date>=wThis&&w.sport==='run').reduce((s,w)=>s+(w.dist||0),0);
  const kmLast = workouts.filter(w=>w.date>=wLast&&w.date<wThis&&w.sport==='run').reduce((s,w)=>s+(w.dist||0),0);
  if (kmLast>5 && kmThis>kmLast*1.15) ins.push({t:'warn', icon:'📏', cat:'OBJĘTOŚĆ', msg:`Bieg tego tygodnia: ${kmThis.toFixed(0)} km vs ${kmLast.toFixed(0)} km poprzednio (+${Math.round((kmThis/kmLast-1)*100)}%). Przekroczono zasadę 10%.`});

  // 7. Balans sportów (14 dni)
  const b = {bike:last14.filter(w=>w.sport==='bike').length, pull:last14.filter(w=>w.sport==='pull').length};
  if (last14.length>=4 && b.bike===0) ins.push({t:'info', icon:'🚴', cat:'BALANS', msg:`Brak roweru w ostatnich 2 tygodniach. Rower aktywnie regeneruje stawy i buduje bazę tlenową bez obciążania nóg.`});
  if (last14.length>=4 && b.pull===0) ins.push({t:'info', icon:'💪', cat:'BALANS', msg:`Brak drążków w ostatnich 2 tygodniach. Siła górna i core chronią przed dysbalansem biegowym.`});

  // 8. Trend tempa treningów jakościowych
  const qual = sorted.filter(w=>w.sport==='run'&&(w.type==='interval'||w.type==='tempo')&&w.dist>0&&w.dur>0);
  if (qual.length>=4) {
    const r2=qual.slice(-2), o2=qual.slice(-4,-2);
    const rP=r2.reduce((s,w)=>s+w.dur*60/w.dist,0)/2;
    const oP=o2.reduce((s,w)=>s+w.dur*60/w.dist,0)/2;
    const d=oP-rP;
    if (d>10) ins.push({t:'good', icon:'⚡', cat:'SZYBKOŚĆ', msg:`Tempo treningów jakościowych poprawia się: ${fmtPace(oP)}→${fmtPace(rP)}/km. Adaptacja przebiega zgodnie z planem!`});
    if (d<-15) ins.push({t:'warn', icon:'⚡', cat:'SZYBKOŚĆ', msg:`Tempo treningów jakościowych spada: ${fmtPace(oP)}→${fmtPace(rP)}/km. Sprawdź regenerację i nawodnienie.`});
  }

  // 9. Wysokie RPE na łatwych biegach (ostatnie 7 dni)
  const hiRPE = last7.filter(w=>w.sport==='run'&&w.type==='easy'&&w.rpe>=7);
  if (hiRPE.length>0) ins.push({t:'warn', icon:'🎯', cat:'RPE', msg:`${hiRPE.length} łatwy bieg z RPE≥7 — wysiłek nieodpowiedni do regeneracji. Zwolnij, łatwy bieg powinien być naprawdę łatwy.`});

  // 10. Optymalna forma do startu
  if (todayP.tsb>=5&&todayP.tsb<=15&&todayP.ctl>30) ins.push({t:'good', icon:'🏆', cat:'FORMA STARTOWA', msg:`TSB ${todayP.tsb.toFixed(0)} przy CTL ${todayP.ctl.toFixed(0)} — optymalny stan. Idealny moment na test lub start w zawodach.`});

  if (ins.length===0) ins.push({t:'info', icon:'📊', cat:'TRENER', msg:'Wpisz więcej treningów — analiza potrzebuje kilku sesji żeby wykrywać trendy.'});
  return ins;
}

// RENDER — PLAN
// ═══════════════════════════════════════════════════════════════
function renderPlan() {
  const today = todayStr();
  const planStart = new Date(PLAN_START);
  const now = new Date(today);
  const weekNow = Math.max(1, Math.min(20, Math.floor((now-planStart)/(7*864e5))+1));
  const planDoneLocal = planDone;

  // progress
  const totalSess = PLAN_DATA.reduce((s,w)=>s+w.sessions.length,0);
  const doneSess  = Object.keys(planDoneLocal).length;
  const pct = Math.round(doneSess/totalSess*100);

  let html = `
  <div class="plan-prog"><div class="cl">Postęp planu 20 tygodni</div>
    <div class="pp-bar"><div class="pp-fill" style="width:${pct}%"></div></div>
    <div class="pp-stats">Sesji: <span>${doneSess}/${totalSess}</span> Tyg: <span>${weekNow}/20</span> Km plan: <span>${PLAN_DATA.slice(0,weekNow).reduce((s,w)=>s+w.km,0)}</span></div>
  </div>`;

  PLAN_DATA.forEach((week, wi) => {
    const wStart = new Date(planStart); wStart.setDate(wStart.getDate() + wi*7);
    const wEnd   = new Date(wStart); wEnd.setDate(wEnd.getDate()+6);
    const fmtD = d => d.toLocaleDateString('pl-PL',{month:'short',day:'numeric'});
    const isCurrent = week.w === weekNow;
    const phaseColors = {baza:'var(--cyan)',budowanie:'var(--lime)',szczyt:'var(--amber)',utrzymanie:'var(--orange)'};
    const pc = phaseColors[week.phase]||'var(--m)';
    const weekDone = week.sessions.filter(s=>planDoneLocal[`${week.w}-${s.day}`]).length;

    html += `<div class="plan-week${isCurrent?' today-mark':''}">
      <div class="pw-h" onclick="togglePlanWeek(${week.w})">
        <div class="pw-num" style="color:${pc}">TYG ${week.w}</div>
        <div class="pw-phase" style="background:${pc}22;color:${pc}">${week.phase.toUpperCase()}</div>
        <div class="pw-dates">${fmtD(wStart)} – ${fmtD(wEnd)}</div>
        <div class="pw-prog">${weekDone}/${week.sessions.length}</div>
      </div>
      <div class="pw-b${isCurrent?' open':''}" id="pw-${week.w}">`;

    week.sessions.forEach(s => {
      const k = `${week.w}-${s.day}`;
      const isDone = !!planDoneLocal[k];
      const isToday = wStart.toISOString().split('T')[0] === today && s.day === 1;
      html += `<div class="sr${isDone?' today-mark':''}">
        <div class="sr-day">D${s.day}</div>
        <div class="sr-ico">${s.icon}</div>
        <div class="sr-body">
          <div class="sr-title" style="${isDone?'text-decoration:line-through;color:var(--m)':''}">${s.title}</div>
          <div class="sr-desc">${s.desc}</div>
          ${s.note?`<div class="sr-note">${s.note}</div>`:''}
          <div class="sr-tags">${s.tags.map(t=>`<div class="sr-tag">${t}</div>`).join('')}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">
          <button class="sr-chk${isDone?' done':''}" onclick="togglePlanDone('${k}')">${isDone?'✓':''}</button>
          ${!isDone?`<button onclick="openAddFromPlan('${s.sport}','${s.type}','${s.title.replace(/'/g,"\\'")}','${s.note?s.note.replace(/'/g,"\\'"):''}')" style="font-size:8px;padding:3px 6px;background:transparent;border:1px solid var(--lime);color:var(--lime);cursor:pointer;font-family:inherit;border-radius:2px;white-space:nowrap">+ Dodaj</button>`:''}
        </div>
      </div>`;
    });

    html += `<div class="pw-sum">Cel: ${week.km} km · ${week.phase}</div></div></div>`;
  });
  return html;
}

function togglePlanWeek(w) {
  const el = document.getElementById(`pw-${w}`);
  if (el) el.classList.toggle('open');
}

async function togglePlanDone(k) {
  if (planDone[k]) delete planDone[k];
  else planDone[k] = true;
  await dbSet('planDone', planDone);
  render();
}

function buildWeeklyChart() {
  const canvas = document.getElementById('weeklyChart');
  if (!canvas) return;
  // Build last 8 weeks (Mon–Sun)
  const weeks = [];
  const now = new Date();
  const dow = (now.getDay()||7)-1;
  const mon = new Date(now); mon.setDate(mon.getDate()-dow);
  for (let i=7;i>=0;i--) {
    const wMon = new Date(mon); wMon.setDate(wMon.getDate()-i*7);
    const wSun = new Date(wMon); wSun.setDate(wSun.getDate()+6);
    const wMonS = wMon.toISOString().split('T')[0];
    const wSunS = wSun.toISOString().split('T')[0];

// RENDER — PREDICTIONS
// ═══════════════════════════════════════════════════════════════
function renderPredictions() {
  const pmc = calcPMC();
  const todayP = pmc.find(p=>p.date===todayStr()) || {ctl:0};
  const runs = workouts.filter(w=>w.sport==='run'&&w.dist&&w.dur);
  if (!runs.length) return '<div class="card"><div class="cl">Brak danych biegów</div><div style="color:var(--m2);font-size:11px">Dodaj treningi, aby zobaczyć predykcje.</div></div>';

  const avgPaceAll = runs.reduce((s,w)=>s+(w.dur*60/w.dist),0)/runs.length;
  const recentRuns = runs.filter(w=>w.date>=new Date(Date.now()-30*864e5).toISOString().split('T')[0]);
  const avgPaceRecent = recentRuns.length ? recentRuns.reduce((s,w)=>s+(w.dur*60/w.dist),0)/recentRuns.length : avgPaceAll;
  const tempoRuns = runs.filter(w=>w.type==='tempo'&&w.avgHR>settings.lthr*0.9);
  const racePace = tempoRuns.length ? tempoRuns.reduce((s,w)=>s+(w.dur*60/w.dist),0)/tempoRuns.length : avgPaceRecent*0.93;

  // Riegel predictions
  const d5=5, d10=10, d21=21.1, d42=42.2;
  const refRace = workouts.filter(w=>w.sport==='run'&&w.type==='race'&&w.dist>5).sort((a,b)=>b.dist-a.dist)[0];
  const refDist = refRace ? refRace.dist : 10;
  const refSec  = refRace ? refRace.dur*60 : avgPaceRecent*10;
  const riegel  = (d) => refSec * Math.pow(d/refDist, 1.06);

  const predictions = [
    {dist:'5 km',    sec:riegel(d5),   label:'5K'},
    {dist:'10 km',   sec:riegel(d10),  label:'10K'},
    {dist:'Półmaraton 21.1 km', sec:riegel(d21), label:'HM'},
    {dist:'Maraton 42.2 km',   sec:riegel(d42), label:'M'},
  ];

  const ctl = todayP.ctl;
  let potential = '';
  if (ctl>80) potential='Forma szczytowa — gotowy na PR';
  else if (ctl>60) potential='Dobra forma — możliwy PB przy świeżości';
  else if (ctl>40) potential='Budowanie bazy — za wcześnie na szczyt';
  else potential='Wczesna faza — skup się na objętości';

  let html = `
  <div class="card"><div class="cl">Predykcje Riegel (bazując na ${refRace?`wyścigu ${refRace.dist}km`:'tempo runnach'})</div>`;
  predictions.forEach(p => {
    const pace = p.sec/refDist; // s/km
    const total = fmtDur(p.sec/60);
    html += `<div class="wrow"><div class="sd" style="background:var(--lime)"></div>
      <div class="wk" style="color:var(--lime);font-size:13px">${p.label}</div>
      <div class="wp">${p.dist}</div>
      <div class="wh" style="font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--t)">${total}</div>
      <div class="tv">${fmtPace(p.sec/(refDist>10?refDist:refDist))}/km</div>
    </div>`;
  });
  html += `</div>
  <div class="card"><div class="cl">Analiza potencjału</div>
    <div style="font-size:11px;color:var(--m2);line-height:1.8">
      <div>CTL: <span style="color:var(--cyan)">${ctl.toFixed(0)}</span> — ${potential}</div>
      <div>Śr. tempo 30 dni: <span style="color:var(--lime)">${fmtPace(avgPaceRecent)}/km</span></div>
      <div>Pace progowy (LTHR): <span style="color:var(--amber)">${tempoRuns.length?fmtPace(racePace)+'/km':'brak danych tempo'}</span></div>
    </div>
  </div>
  <div class="card"><div class="cl">Kalkulator stref tempa (Jack Daniels)</div>
    <div style="font-size:10px;color:var(--m2);margin-bottom:10px">Wpisz ostatni czas wyścigu lub biegu testowego:</div>
    <div style="display:flex;gap:6px;margin-bottom:10px;align-items:center">
      <select id="vdotDist" style="flex:1;background:var(--bg2);border:1px solid var(--b2);color:var(--t);padding:8px;font-family:inherit;font-size:10px">
        <option value="5">5 km</option>
        <option value="10" selected>10 km</option>
        <option value="21.1">Półmaraton</option>
        <option value="42.2">Maraton</option>
      </select>
      <input id="vdotH" type="number" min="0" max="5" placeholder="h" style="width:44px;background:var(--bg2);border:1px solid var(--b2);color:var(--t);padding:8px;font-family:inherit;font-size:12px;text-align:center">
      <input id="vdotM" type="number" min="0" max="59" placeholder="mm" style="width:52px;background:var(--bg2);border:1px solid var(--b2);color:var(--t);padding:8px;font-family:inherit;font-size:12px;text-align:center">
      <input id="vdotS" type="number" min="0" max="59" placeholder="ss" style="width:52px;background:var(--bg2);border:1px solid var(--b2);color:var(--t);padding:8px;font-family:inherit;font-size:12px;text-align:center">
      <button onclick="calcVdot()" style="padding:8px 12px;background:var(--lime);color:#000;border:none;font-family:inherit;font-size:10px;font-weight:700;cursor:pointer;border-radius:2px">OK</button>
    </div>
    <div id="vdotResult"></div>
  </div>`;
  return html;
}

function calcVdot() {
  const dist = parseFloat(document.getElementById('vdotDist').value);
  const h = parseInt(document.getElementById('vdotH').value)||0;
  const m = parseInt(document.getElementById('vdotM').value)||0;
  const s = parseInt(document.getElementById('vdotS').value)||0;
  const totalSec = h*3600+m*60+s;
  if (!totalSec||totalSec<60) return;
  const basePace = totalSec/dist; // s/km
  // Jack Daniels strefy jako % tempa progowego (T-pace)
  // T-pace ≈ tempo 60-min race pace (approx LTHR pace)
  // E=76%, M=88%, T=100%, I=106%, R=115% prędkości
  const tPace = basePace * (dist<=10 ? 1.08 : dist<=21.1 ? 1.03 : 1.0);
  const zones = [
    {z:'E  — Łatwy',       pct:1.30, color:'#22d3ee', desc:'Długie biegi, regeneracja'},
    {z:'M  — Maratoński',  pct:1.13, color:'#a3e635', desc:'Długie tempo, long run'},
    {z:'T  — Progowy',     pct:1.00, color:'#fbbf24', desc:'Cruise intervals, 20–40 min'},
    {z:'I  — Interwałowy', pct:0.94, color:'#fb923c', desc:'Powtórzenia 1–2 km'},
    {z:'R  — Repetycje',   pct:0.87, color:'#fb7185', desc:'Powtórzenia 200–400 m'},
  ];
  let html='<div style="margin-top:4px">';
  zones.forEach(z=>{
    const pace = tPace*z.pct;
    html+=`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--b)">
      <div style="width:3px;height:32px;background:${z.color};flex-shrink:0;border-radius:2px"></div>
      <div style="flex:1">
        <div style="font-size:10px;letter-spacing:.1em;color:${z.color}">${z.z}</div>
        <div style="font-size:9px;color:var(--m2)">${z.desc}</div>
      </div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:var(--t)">${fmtPace(pace)}<span style="font-size:9px;color:var(--m2)">/km</span></div>
    </div>`;
  });
  html+='</div>';
  document.getElementById('vdotResult').innerHTML=html;
}

const mobToday = () => todayStr();
const exById = id => EX.find(e => e.id === id);
const catColor = cat => (CATS[cat]||{color:'#888'}).color;
const catLabel = cat => (CATS[cat]||{label:cat}).label;

function getMobPhase(w) {
  if (w<=5) return 'baza';
  if (w<=10) return 'budowanie';
  if (w<=15) return 'szczyt';
  return 'utrzymanie';
}
function getMobPhaseLabel() {
  return {baza:'BAZA',budowanie:'BUDOWANIE',szczyt:'SZCZYT',utrzymanie:'UTRZYMANIE'}[getMobPhase(mobWeek)]||'BAZA';
}
function getMobProgLevel() {
  if (mobWeek<=6) return 1;
  if (mobWeek<=12) return 2;
  return 3;
}
function getMobPhaseColor(p) {
  return {baza:'var(--cyan)',budowanie:'var(--lime)',szczyt:'var(--amber)',utrzymanie:'var(--orange)'}[p]||'var(--purple)';
}
function calcMobCurrentWeek() {
  const start = new Date(PROGRAM_START);
  const diff = Math.floor((new Date()-start)/(7*864e5));
  return Math.min(Math.max(diff+1,1),18);
}
function getMobSessionExercises() {
  const phase = getMobPhase(mobWeek);
  const tmpl = SESSIONS[phase];
  return tmpl.ids.map(s => { const ex=exById(s.id); return ex?{...ex,note:s.note}:null; }).filter(Boolean);
}
function mobDurText(ex) {
  if (ex.time) return ex.bilateral?`${ex.time}s/str.`:`${ex.time}s`;
  return `${ex.reps}×${ex.sets}`;
}
function fmtTimer(s) {
  const m=Math.floor(s/60); return `${m}:${String(s%60).padStart(2,'0')}`;
}
function beep(freq=880,dur=0.15) {
  try {
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value=freq;
    g.gain.setValueAtTime(0.25,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.start(); o.stop(ctx.currentTime+dur);
  } catch(e){}
}
function calcMobStreak() {
  let streak=0; const d=new Date();
  for(let i=0;i<365;i++){
    const k=d.toISOString().split('T')[0];
    if(Object.keys(mobHistory[k]||{}).length>0) streak++;
    else if(i>0) break;
    d.setDate(d.getDate()-1);
  }
  return streak;
}

function openExModal(id) {
  const ex=exById(id); if(!ex) return;
  exModalId=id; exRepCount=0; exCurrentSet=1; exTotalSets=ex.sets||1;
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;timerRunning=false;}
  document.getElementById('exTitle').textContent=ex.name;
  document.getElementById('exSub').textContent=ex.muscles;
  let body=`<ul class="mod-steps">${ex.steps.map(s=>`<li>${s}</li>`).join('')}</ul>`;
  if(ex.time){
    timerSecs=ex.time;
    body+=`<div class="t-display">
      <div class="t-val" id="tVal">${fmtTimer(ex.time)}</div>
      ${ex.bilateral?`<div class="t-side" id="tSide">LEWA STRONA</div>`:''}
      <div class="t-lbl" id="tLbl">${ex.sets>1?`${ex.sets} serie`:'czas'}</div>
    </div>
    <div class="set-row" id="setRow">${renderExDots(ex.sets)}</div>
    <div class="t-btns">
      <button class="tbtn primary" id="tStart" onclick="startExTimer()">▶ START</button>
      <button class="tbtn" onclick="skipExTimer()">POMIŃ</button>
    </div>`;
  } else {
    body+=`<div class="rep-ctrl">
      <button class="rbtn" onclick="chgExRep(-1)">−</button>
      <div><div class="rval" id="rVal">${exRepCount}</div><div class="rlbl">Powtórzenia</div></div>
      <button class="rbtn" onclick="chgExRep(1)">+</button>
    </div>
    <div style="text-align:center;font-size:9px;color:var(--m2)">Cel: ${ex.reps} powt × ${ex.sets} serie · przerwa 45–60s</div>
    <div class="set-row" id="setRow">${renderExDots(ex.sets)}</div>`;
  }
  const lv=getMobProgLevel();
  const progVal=lv===1?ex.prog.w1:lv===2?ex.prog.w6:ex.prog.w11;
  body+=`<div class="ebm" style="margin-top:12px"><div class="ebm-l">📚 EBM</div><div class="ebm-t">${ex.science}</div></div>`;
  body+=`<div style="margin-top:10px;font-size:10px;color:var(--purple)">L${lv} · ${lv===1?'Tyg 1–6':lv===2?'Tyg 7–12':'Tyg 13–18'}: ${progVal}</div>`;
  document.getElementById('exBody').innerHTML=body;
  document.getElementById('exModal').style.display='flex';
}

function renderExDots(n) {
  return Array.from({length:n},(_,i)=>`<div class="sdot${i===0?' cur':''}" id="dot${i}"></div>`).join('');
}

function startExTimer() {
  if(timerRunning){clearInterval(timerInterval);timerRunning=false;const b=document.getElementById('tStart');if(b)b.textContent='▶ START';return;}
  const ex=exById(exModalId); if(!ex) return;
  timerRunning=true; const b=document.getElementById('tStart');if(b)b.textContent='⏸ PAUZA';
  let side=1, secs=ex.time;
  timerInterval=setInterval(()=>{
    secs--;
    const v=document.getElementById('tVal'); if(v) v.textContent=fmtTimer(secs);
    if(secs<=3&&secs>0) beep(660,0.1);
    if(secs<=0){
      beep(880,0.2); setTimeout(()=>beep(880,0.2),250);
      if(ex.bilateral&&side===1){
        side=2; secs=ex.time;
        const sl=document.getElementById('tSide'); if(sl){sl.textContent='PRAWA STRONA';sl.style.color='var(--rose)';}
        const lbl=document.getElementById('tLbl'); if(lbl) lbl.textContent='zmień stronę';
      } else {
        clearInterval(timerInterval); timerRunning=false;
        const dot=document.getElementById(`dot${exCurrentSet-1}`);
        if(dot){dot.classList.remove('cur');dot.classList.add('done');}
        if(exCurrentSet<exTotalSets){
          exCurrentSet++;
          const nd=document.getElementById(`dot${exCurrentSet-1}`); if(nd) nd.classList.add('cur');
          secs=30; side=1;
          const lbl=document.getElementById('tLbl'); if(lbl) lbl.textContent='ODPOCZYNEK';
          if(v) v.textContent=fmtTimer(30);
          const b2=document.getElementById('tStart'); if(b2) b2.textContent='▶ START';
          timerInterval=setInterval(()=>{
            secs--;
            const v2=document.getElementById('tVal'); if(v2) v2.textContent=fmtTimer(secs);
            if(secs<=0){
              clearInterval(timerInterval); timerRunning=false;
              const lbl2=document.getElementById('tLbl'); if(lbl2) lbl2.textContent='czas';
              const v3=document.getElementById('tVal'); if(v3) v3.textContent=fmtTimer(ex.time);
              const b3=document.getElementById('tStart'); if(b3) b3.textContent='▶ START';
              const sl2=document.getElementById('tSide'); if(sl2){sl2.textContent='LEWA STRONA';sl2.style.color='var(--amber)';}
            }
          },1000);
        } else {
          const v2=document.getElementById('tVal'); if(v2) v2.textContent='✓';
          const lbl=document.getElementById('tLbl'); if(lbl) lbl.textContent='UKOŃCZONO';
          const b2=document.getElementById('tStart'); if(b2) b2.textContent='▶ START';
        }
      }
    }
  },1000);
}

function skipExTimer(){if(timerInterval){clearInterval(timerInterval);timerRunning=false;}const v=document.getElementById('tVal');if(v)v.textContent='✓';}
function chgExRep(d){
  exRepCount=Math.max(0,exRepCount+d);
  const rv=document.getElementById('rVal'); if(rv) rv.textContent=exRepCount;
  const ex=exById(exModalId);
  if(ex&&exRepCount>=ex.reps&&exCurrentSet<exTotalSets){
    exCurrentSet++;
    document.querySelectorAll('#setRow .sdot').forEach((dot,i)=>{dot.className='sdot'+(i<exCurrentSet-1?' done':i===exCurrentSet-1?' cur':'');});
    exRepCount=0; if(rv) rv.textContent=0;
  }
}

    if(!mobHistory[d]) mobHistory[d]={};

function closeExModal(){

  document.getElementById('fNotes').value=note||'';
  setSport(sport);
  document.getElementById('fType').value=type||'easy';
  document.getElementById('addModal').style.display='flex';
}
function openEdit(id){
  const w=workouts.find(x=>x.id===id); if(!w) return;
  editId=id;
  document.getElementById('modTitle').textContent='Edytuj trening';
  setSport(w.sport);
  if(w.sport==='pull'){
    document.getElementById('fPullDate').value=w.date;
    document.getElementById('fPullReps').value=w.reps||'';
    document.getElementById('fPullSets').value=w.sets||'';
    document.getElementById('fPullDur').value=w.dur||'';
    document.getElementById('fPullNotes').value=w.notes||'';
  } else {
    document.getElementById('fDate').value=w.date;
    document.getElementById('fDist').value=w.dist||'';
    document.getElementById('fDur').value=w.dur||'';
    document.getElementById('fAvgHR').value=w.avgHR||'';
    document.getElementById('fMaxHR').value=w.maxHR||'';
    document.getElementById('fType').value=w.type||'easy';
    document.getElementById('fRpe').value=w.rpe||5;
    document.getElementById('rpeL').textContent=`Wysiłek (RPE): ${w.rpe||5}/10`;
    document.getElementById('fCad').value=w.cad||'';
    document.getElementById('fElev').value=w.elev||'';
    document.getElementById('fNotes').value=w.notes||'';
  }
  document.getElementById('addModal').style.display='flex';
}
function setSport(s){
  currentSport=s;
  ['run','bike','pull'].forEach(x=>{
    const b=document.getElementById(`b${x.charAt(0).toUpperCase()+x.slice(1)}`);
    if(b) b.className=`sb${s===x?x==='run'?' ar':x==='bike'?' ab':' ap':''}`;
  });
  document.getElementById('cardioFields').style.display=s==='pull'?'none':'block';
  document.getElementById('pullFields').style.display=s==='pull'?'block':'none';
  updateTSS();
}
function updateTSS(){
  const dur=parseFloat(document.getElementById('fDur')?.value)||0;
  const hr=parseFloat(document.getElementById('fAvgHR')?.value)||0;
  const rpe=parseFloat(document.getElementById('fRpe')?.value)||5;
  const dist=parseFloat(document.getElementById('fDist')?.value)||0;
  const p=document.getElementById('tssP');
  if(!dur&&!dist){if(p) p.style.display='none';return;}
  const fakeW={sport:currentSport,dur,avgHR:hr,dist,rpe,lthr:settings.lthr};
  const tss=calcTSS({...fakeW});
  if(p) p.style.display='flex';
  const tv=document.getElementById('tssV'); if(tv) tv.textContent=tss;
}
async function saveWorkout(){
  const id=editId||('w'+Date.now());
  let w={id,sport:currentSport};
  if(currentSport==='pull'){
    w.date=document.getElementById('fPullDate').value;
    w.reps=+document.getElementById('fPullReps').value||0;
    w.sets=+document.getElementById('fPullSets').value||0;
    w.dur=+document.getElementById('fPullDur').value||0;
    w.notes=document.getElementById('fPullNotes').value;
    w.type='easy'; w.dist=0; w.avgHR=0; w.maxHR=0;
  } else {
    w.date=document.getElementById('fDate').value;
    w.dist=+document.getElementById('fDist').value||0;
    w.dur=+document.getElementById('fDur').value||0;
    w.avgHR=+document.getElementById('fAvgHR').value||0;
    w.maxHR=+document.getElementById('fMaxHR').value||0;
    w.type=document.getElementById('fType').value;
    w.rpe=+document.getElementById('fRpe').value||5;
    w.cad=+document.getElementById('fCad').value||0;
    w.elev=+document.getElementById('fElev').value||0;
    w.notes=document.getElementById('fNotes').value;
  }
  if(editId) workouts=workouts.filter(x=>x.id!==editId);
  workouts.push(w);
  await dbSet('workouts',workouts);
  closeModals(); render();
  showToast(editId?'Trening zaktualizowany':'Trening zapisany ✓');
}
async function deleteWorkout(id){
  workouts=workouts.filter(w=>w.id!==id);
  await dbSet('workouts',workouts);
  render();
  showToast('Usunięto');
}
function toggleAdv(){
  const s=document.getElementById('advSec');
  if(s) s.style.display=s.style.display==='none'?'block':'none';
}
function closeModals(){
  document.getElementById('addModal').style.display='none';
  document.getElementById('settingsModal').style.display='none';
}

// ═══════════════════════════════════════════════════════════════
// SETTINGS
// ═══════════════════════════════════════════════════════════════
function openSettings(){
  document.getElementById('sMax').value=settings.maxHR;
  document.getElementById('sRest').value=settings.rhr;
  document.getElementById('sThr').value=settings.lthr;
  document.getElementById('sWkly').value=settings.wkly;
  const zones=karvonen();
  document.getElementById('zonesTable').innerHTML=zones.map(z=>`<div><span style="color:${z.c}">${z.z} ${z.label}</span>  ${z.min}–${z.max} bpm</div>`).join('');
  document.getElementById('settingsModal').style.display='flex';
}
async function saveSettings(){
  settings.maxHR=+document.getElementById('sMax').value||DEFAULT_MAX_HR;
  settings.rhr=+document.getElementById('sRest').value||DEFAULT_RHR;
  settings.lthr=+document.getElementById('sThr').value||DEFAULT_LTHR;
  settings.wkly=+document.getElementById('sWkly').value||DEFAULT_WKLY;
  await dbSet('settings',settings);
  closeModals(); render();
  showToast('Ustawienia zapisane');
}

// ═══════════════════════════════════════════════════════════════
// EXPORT / IMPORT
// ═══════════════════════════════════════════════════════════════
function exportData(){
  const blob=new Blob([JSON.stringify({workouts,settings,pr,planDone,mobHistory,mobWeek},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`runcoach-${todayStr()}.json`; a.click();
}
async function importData(inp){
  const file=inp.files[0]; if(!file) return;
  const txt=await file.text();
  try{
    const d=JSON.parse(txt);
    if(d.workouts) workouts=d.workouts;
    if(d.settings) settings=d.settings;
    if(d.pr) pr=d.pr;
    if(d.planDone) planDone=d.planDone;
    if(d.mobHistory) mobHistory=d.mobHistory;
    if(d.mobWeek) mobWeek=d.mobWeek;
    await Promise.all([dbSet('workouts',workouts),dbSet('settings',settings),dbSet('pr',pr),dbSet('planDone',planDone),dbSet('mobHistory',mobHistory),dbSet('mobWeek',mobWeek)]);
    closeModals(); render();
    showToast('Dane zaimportowane ✓');
  }catch(e){showToast('Błąd importu');}
}
function exportCSV(){
  const rows=[['data','sport','typ','dystans','czas','HR_sr','HR_max','kadencja','prevyzszenie','RPE','notatki','TSS']];
  workouts.sort((a,b)=>a.date.localeCompare(b.date)).forEach(w=>rows.push([w.date,w.sport,w.type||'',w.dist||'',w.dur||'',w.avgHR||'',w.maxHR||'',w.cad||'',w.elev||'',w.rpe||'',w.notes||'',calcTSS(w)]));
  const csv=rows.map(r=>r.map(v=>`"${v}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`runcoach-${todayStr()}.csv`; a.click();
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

async function init(){
  await initDB();
  const [storedW, storedS, storedPR, storedPD, storedMH, storedMW] = await Promise.all([
    dbGet('workouts'), dbGet('settings'), dbGet('pr'), dbGet('planDone'), dbGet('mobHistory'), dbGet('mobWeek')
  ]);
  workouts = storedW || SEED_WORKOUTS;
  if(!storedW) await dbSet('workouts', workouts);
  settings = storedS || settings;
  pr = storedPR || SEED_PR;
  planDone = storedPD || {};
  mobHistory = storedMH || {};
  mobWeek = storedMW || calcMobCurrentWeek();
  if(!storedPR) await dbSet('pr', pr);
  render();
}
init();
</script>
